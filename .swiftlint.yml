# SwiftLint 配置 — NetBar
# 生产级代码规范

disabled_rules:
  - trailing_whitespace
  - line_length          # 允许长行（SwiftUI 声明式链式调用）
  - function_body_length # 部分监控逻辑需要较长函数

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_filter_count
  - fallthrough
  - first_where
  - implicit_return
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

excluded:
  - .build
  - .swiftpm
  - DerivedData

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 500
  error: 800

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y
    - ip

nesting:
  type_level: 3
  function_level: 3
